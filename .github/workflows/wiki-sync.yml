name: Wiki sync

# Fills in each episode's scores from the Taskmaster Wiki, and the titles of
# the episodes still to come (tools/sync-wiki.mjs). Episodes stream on
# Thursdays at 10pm London time: 21:00 UTC in British Summer Time, 22:00 UTC in
# winter. The first run is an hour after that (22:05 or 23:05 UTC); the tool
# itself waits until a stream started at least an hour ago and the wiki's
# table is finished, so later runs, hourly through Friday, pick the scores up
# if the wiki was slow. Runs with nothing new change nothing. Picks aren't on
# the wiki; they're still entered in edit mode. Run it by hand from the
# Actions tab (Run workflow) any time.
on:
  schedule:
    - cron: "5 22,23 * * 4"
    - cron: "5 * * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync with the wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync and commit
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Someone may save from edit mode at the same moment: start again from
          # their copy (the tool is safe to re-run) rather than overwrite it.
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node tools/sync-wiki.mjs --message "$RUNNER_TEMP/message.txt"
            if git diff --quiet; then exit 0; fi
            git commit -q -a -F "$RUNNER_TEMP/message.txt"
            if git push -q origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              cat "$RUNNER_TEMP/message.txt" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "main moved while syncing; trying again"
            sleep 10
          done
          exit 1
      # A push from this workflow may not start a GitHub Pages build by itself,
      # so ask for one (harmless if it already started).
      - name: Redeploy the site
        if: steps.sync.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
      # The same check CI runs on every push (a push from this workflow doesn't
      # start the Checks workflow).
      - name: Check the data
        if: steps.sync.outputs.pushed == 'true'
        run: node tools/check-data.mjs
