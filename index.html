<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fantasky Master</title>
  <meta name="description" content="Our fantasy league for Taskmaster: pick a contestant each episode, score when they do well, and see who calls the series best.">
  <meta name="theme-color" content="#2a0707">
  <!-- The link preview (WhatsApp, iMessage, Slack…) and home-screen icons: drawn by tools/share-images.mjs. Preview URLs must be absolute. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Fantasky Master">
  <meta property="og:title" content="Fantasky Master">
  <meta property="og:description" content="Our fantasy league for Taskmaster: pick a contestant each episode, score when they do well, and see who calls the series best.">
  <meta property="og:url" content="https://kbroadie.github.io/fantasky-master/">
  <meta property="og:image" content="https://kbroadie.github.io/fantasky-master/img/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Fantasky Master: a Taskmaster fantasy league, with this series' five contestants in gold frames">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Fantasky">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="img/icon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Mono:wght@400;500&family=Nunito:wght@700;800&family=Inter:wght@400;500;600;700;800;900&display=swap">
  <!-- Patatas's voice and his name plate: only the letters he uses -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Cinzel:wght@700&text=EmbracefailuresuccessPatatas&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="modulepreload" href="js/csv.js">
  <link rel="modulepreload" href="js/league.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/views/table.js">
  <link rel="modulepreload" href="js/edit.js">
  <link rel="modulepreload" href="js/checks.js">
  <link rel="modulepreload" href="js/heroes.js">
  <link rel="modulepreload" href="js/alltime.js">
  <link rel="preload" href="data/taskmaster_stats.csv" as="fetch" crossorigin>
  <link rel="modulepreload" href="js/views/episodes.js">
  <link rel="modulepreload" href="js/views/cast.js">
  <script type="module" src="js/main.js"></script>
</head>
<body class="loading">
  <!-- Fantasy mode's fall, behind everything while the dream shows (flip.js) -->
  <canvas id="fz-fall" aria-hidden="true"></canvas>
  <div class="topbar">
    <header class="hdr">
      <div class="brand"><span class="fz-word">FAN<span class="w">TAS</span>TI<span class="w">K</span>AL</span><span class="fz-name"><span class="g">FAN</span>TASK<span class="g">Y</span> MASTER</span><span class="fz-del">DELUSION</span><button id="series" class="series" type="button"><span id="series-num">22</span><svg class="swap" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 4h8M7 1.5 9.5 4 7 6.5M10.5 8h-8M5 5.5 2.5 8 5 10.5"/></svg></button></div>
      <div class="cd" id="cd" role="timer"></div>
    </header>
    <nav class="tabs" aria-label="Sections">
      <span class="tabs-bg" aria-hidden="true"></span>
      <span class="tab-ind" aria-hidden="true"></span>
      <button class="tab" data-page="standings" type="button" aria-selected="true">
        <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="14" width="7" height="11" rx="1" opacity=".7"/><rect x="10.5" y="8" width="7" height="17" rx="1"/><rect x="19" y="18" width="7" height="7" rx="1" opacity=".5"/><path d="M12 6l2-3 2 3 2-2-.5 4h-7L10 4Z"/></svg>
        <span>Standings</span></button>
      <button class="tab" data-page="episodes" type="button" aria-selected="false">
        <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="4" y="10" width="20" height="14" rx="2" opacity=".35"/><rect x="4" y="5.5" width="20" height="5" rx="1.5"/><path d="M12 14.5v7l6-3.5Z"/></svg>
        <span>Episodes</span></button>
      <button class="tab" data-page="cast" type="button" aria-selected="false">
        <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M5 20v-8l4 4 5-8 5 8 4-4v8Z"/><rect x="5" y="21" width="18" height="3" rx="1"/></svg>
        <span>Cast</span></button>
    </nav>
  </div>

  <main>
    <section class="page" id="p-standings">
      <div class="strip scroll" id="st-tabs"></div>
      <div id="welcome" hidden></div>
      <div class="swiper" id="st-body"><p class="loading-msg">Opening the envelopes…</p></div>
    </section>
    <section class="page" id="p-episodes">
      <div class="strip scroll" id="ep-tabs"></div>
      <div class="swiper" id="ep-body"></div>
    </section>
    <section class="page" id="p-cast">
      <div class="strip even" id="cast-tabs"></div>
      <div class="swiper" id="cast-body"></div>
    </section>
    <!-- Embrace failure / Embrace success: switches the low-scores-win mode, under every tab (main.js) -->
    <div id="dq"></div>
    <!-- Fantasy mode's footer: a still lake under the house's sky, Alex on his rock (styles.css) -->
    <footer class="fz-foot" aria-hidden="true">
      <!-- A lake back to the house footer's horizon; its swell, ripples and what it mirrors drawn on its canvas (stream.js) -->
      <div class="fz-lake"><canvas class="lake-c"></canvas></div>
      <div class="fz-waves">
      </div>
      <!-- Alex Horne as a mermaid on his rock, streaming water from his chest funnel (stream.js); pressing him pumps it up -->
      <div class="fz-alex"><span class="fz-mer"><img src="img/alex-rock.webp" alt="" width="372" height="295" loading="lazy" decoding="async" draggable="false"></span><canvas class="mr-water"></canvas></div>
    </footer>
  </main>
  <footer class="foot" id="foot"></footer>
  <!-- Ripple, a transition to and from the low-scores-win mode (flip.js): the page as if seen through a lagoon's surface, rippling
       both ways as one view dissolves into the other. The water moves by sliding one field of noise, not making it anew; the filter's area
       reaches just past the page, as far as it slides -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <filter id="vt-wave" x="-.06" y="-.03" width="1.12" height="1.06" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.014" numOctaves="1" seed="7" result="water"/>
      <feOffset in="water" dx="0" dy="0" result="moving">
        <animate attributeName="dx" values="0;-20" dur="1.5s" begin="indefinite" fill="freeze"/>
        <animate attributeName="dy" values="0;24" dur="1.5s" begin="indefinite" fill="freeze"/>
      </feOffset>
      <feDisplacementMap in="SourceGraphic" in2="moving" scale="0" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" values="0;90;0" dur="1.5s" begin="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".33 0 .67 1;.33 0 .67 1" fill="freeze"/>
      </feDisplacementMap>
    </filter>
  </svg>
</body>
</html>
